<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Redirecting to experiment...</title>
  <style>
    body { font-family: sans-serif; display: flex; justify-content: center;
           align-items: center; height: 100vh; margin: 0; }
    p { color: #555; font-size: 1.1em; }
  </style>
</head>
<body>
  <p>Redirecting to the experiment, please wait...</p>
  <script>
    // Two-stage randomization:
    //  1) which experiment (es-shaping-online vs pre-cc-es-online)
    //  2) which group / coarse-fine order (A vs B)
    // Each is an independent 50/50 draw → 4 equally-likely combinations.
    var experiments = [
      'https://run.pavlovia.org/yamhiroki/es-shaping-online/',
      'https://run.pavlovia.org/yamhiroki/pre-cc-es-online/'
    ];
    var exp   = experiments[Math.random() < 0.5 ? 0 : 1];
    var group = Math.random() < 0.5 ? 'A' : 'B';
    window.location.href = exp + '?site=japan&group=' + group;
  </script>
</body>
</html>
